[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "desktop-ai-companion"
version = "0.0.0.dev0"
description = "Local runtime foundation for a privacy-conscious desktop AI companion robot"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
body = [
  "websockets==15.0.1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
local-speech = [
  "sherpa-onnx==1.13.4",
  "sherpa-onnx-core==1.13.4",
  "sounddevice==0.5.5",
  "samplerate==0.2.4",
]
style-tools = [
  "jieba==0.42.1",
]

[project.scripts]
companion = "companion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
