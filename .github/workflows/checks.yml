name: Shared code checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project dependencies
        run: python -m pip install -e '.[dev,body,local-speech]'
      - name: Check private paths and secret patterns
        run: python scripts/verify_no_private_data.py
      - name: Run synthetic tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests
