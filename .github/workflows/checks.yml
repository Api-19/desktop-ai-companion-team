name: Shared code checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  synthetic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install existing project dependencies
        run: .venv/bin/python -m pip install -e '.[dev,body,local-speech]'
      - name: Check private paths and secret patterns
        run: .venv/bin/python scripts/verify_no_private_data.py
      - name: Run synthetic tests
        env:
          PYTHONPATH: src
        run: .venv/bin/python -m pytest -q -rs tests
